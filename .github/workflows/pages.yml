# Publishes the web page (web/) to GitHub Pages whenever it changes on main:
# https://tie-channel.github.io/lamp/ — only the three files of the page, never the lamp's key.
name: Web page

on:
  push:
    branches: [main]
    paths: ['web/**', 'app/src/test/resources/tuya_vectors.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The page's protocol code against the packets the Android tests use.
      - run: node --test web/tuya.test.mjs
      - run: mkdir site && cp web/index.html web/app.js web/tuya.js site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
